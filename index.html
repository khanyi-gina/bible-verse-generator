<!DOCTYPE html>
<html lang="en">
  <head>

    <link rel="stylesheet" href="src/styles.css" />
    <title>AI Bible Verse Generator</title>
  </head>
  <body class="wallpaper">
    <div class="container">
    <header>
      <h1>𝐀𝐈 𝐁𝐢𝐛𝐥𝐞 𝐕𝐞𝐫𝐬𝐞 𝐆𝐞𝐧𝐞𝐫𝐚𝐭𝐨𝐫</h1>

    <main>
      <form id="verse-generator-form">

          placeholder="Search Bible books, verses, or any topic."

          required
          autocomplete="off"
          class="instructions"

      </form>
      <div class="verse" id="verse"></div>

    <br/>
    <footer>

      <a href="https:/github.com/khanyi-gina/" target="_blank">𝐊𝐡𝐚𝐧𝐲𝐢 𝐆𝐢𝐧𝐚</a> 𝐚𝐧𝐝
        𝐢𝐬
      <a
        href="https://github.com/shecodesio/french-poem-generator"
        target="_blank"
      >
        𝐨𝐩𝐞𝐧-𝐬𝐨𝐮𝐫𝐜𝐞𝐝 𝐨𝐧 𝐆𝐢𝐭𝐇𝐮𝐛</a
      >
        𝐚𝐧𝐝 𝐢𝐬
      <a href="https://ai-bible-verse-generator.netlify.app/" target="_blank"
        >𝐡𝐨𝐬𝐭𝐞𝐝 𝐨𝐧 𝐍𝐞𝐭𝐥𝐢𝐟𝐲.</a
      >.
    </footer>

    <script src="src/index.js"></script>
  </body>
</html>
