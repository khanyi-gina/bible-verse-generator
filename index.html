<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/styles.css" />
    <title>AI Bible Verse Generator</title>
  </head>
  <body>
    <div class="container">
    <header>
      <h1>𝗔𝗜 𝗕𝗶𝗯𝗹𝗲 𝗩𝗲𝗿𝘀𝗲 𝗚𝗲𝗻𝗲𝗿𝗮𝘁𝗼𝗿</h1>
    </header>

    <main>
      <form>
        <input
          type="text"
          placeholder="Enter the topic of the bible verse"
          autofocus
          required
          autocomplete="off"
          class="instructions"
        />
        <input type="submit" class="submit-button" />
      </form>
      <div class="poem">
         𝐆𝐨𝐬𝐩𝐞𝐥 𝐨𝐟 𝐉𝐨𝐡𝐧 (𝐉𝐨𝐡𝐧 1:1) 
         𝑰𝒏 𝒕𝒉𝒆 𝒃𝒆𝒈𝒊𝒏𝒏𝒊𝒏𝒈 𝒘𝒂𝒔 𝒕𝒉𝒆 𝑾𝒐𝒓𝒅, 𝒂𝒏𝒅 𝒕𝒉𝒆 𝑾𝒐𝒓𝒅 𝒘𝒂𝒔 𝒘𝒊𝒕𝒉 𝑮𝒐𝒅, 𝒂𝒏𝒅 𝒕𝒉𝒆 𝑾𝒐𝒓𝒅 𝒘𝒂𝒔 𝑮𝒐𝒅
     </div>
    </main>
    <br/>
    <footer>
      This AI project was coded by
      <a href="https:/github.com/khanyi-gina/" target="_blank">Khanyi Gina</a> and
      is
      <a
        href="https://github.com/shecodesio/french-poem-generator"
        target="_blank"
      >
        open-sourced on GitHub</a
      >
      and is
      <a href="https://ai-bible-verse-generator.netlify.app/" target="_blank"
        >hosted on Netlify</a
      >.
    </footer>

    <script src="src/index.js"></script>
  </body>
</html>
